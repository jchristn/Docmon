name: Docmon CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore src/Docmon.slnx
      - run: dotnet build src/Docmon.slnx -c Release --no-restore
      - run: dotnet test src/Docmon.slnx -c Release --no-build --logger "trx;LogFilePrefix=docmon"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: '**/TestResults/*.trx'
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: dotnet build src/Docmon.Server -f net10.0
      - run: npm ci
        working-directory: dashboard
      - run: npm run lint && npm test && npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - run: npm run test:e2e
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-results
          path: dashboard/test-results/
