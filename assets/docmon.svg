<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-label="Docmon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="220" rx="16" fill="url(#bg)"/>
  <rect x="8" y="8" width="744" height="204" rx="12" fill="none" stroke="#1e2a4a" stroke-width="2"/>

  <!-- whale / container mark -->
  <g transform="translate(52,74)" fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0"  y="0"  width="20" height="20" rx="2"/>
    <rect x="24" y="0"  width="20" height="20" rx="2"/>
    <rect x="48" y="0"  width="20" height="20" rx="2"/>
    <rect x="24" y="-24" width="20" height="20" rx="2"/>
    <path d="M-10 28 h96 a20 20 0 0 1 -20 20 h-52 a24 24 0 0 1 -24 -24 z" fill="url(#ink)" stroke="none" opacity="0.9"/>
    <path d="M-10 24 q-14 0 -18 8" />
  </g>

  <!-- wordmark -->
  <text x="180" y="128" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="86" font-weight="700" fill="url(#ink)" letter-spacing="2">docmon</text>

  <!-- tagline -->
  <text x="184" y="168" font-family="'JetBrains Mono',Consolas,monospace" font-size="20" fill="#94a3b8" letter-spacing="1">manage and monitor your docker stack</text>
</svg>
