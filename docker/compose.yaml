name: docmon
services:
  backend:
    image: jchristn77/docmon-server:v0.1.0
    restart: unless-stopped
    environment:
      DOCMON_BEARER_TOKEN: ${DOCMON_BEARER_TOKEN:?Set DOCMON_BEARER_TOKEN in docker/.env}
      DOCMON_HOST: ${DOCMON_HOST:-0.0.0.0}
      DOCMON_PORT: 8080
      DOCMON_MCP_PORT: 8081
      DOCMON_DATA_DIRECTORY: /app/data
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - docmon-data:/app/data
      - ${DOCMON_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # Mount original Compose project directories at identical absolute paths
      # to enable stack up/down/restart/pull and container pull-and-apply.
      # - /opt/stacks:/opt/stacks
    ports:
      - "${DOCMON_API_BIND:-0.0.0.0}:${DOCMON_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 2
  dashboard:
    image: jchristn77/docmon-dashboard:v0.1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DOCMON_DASHBOARD_BIND:-0.0.0.0}:${DOCMON_DASHBOARD_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 2

volumes:
  docmon-data:
